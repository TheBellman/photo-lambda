name: Go Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Tests
        env:
          CGO_ENABLED: 0
        run: go test -v ./...

      - name: Build Binary
        env:
          GOARCH: arm64
          GOOS: linux
          CGO_ENABLED: 0
        run: |
          go mod download
          go build -o bootstrap ./cmd/photo-lambda
          zip function.zip bootstrap

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: function.zip

